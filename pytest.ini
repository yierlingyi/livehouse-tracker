# pytest configuration for the V4.4 test suite.
#
# Requirements:
#   * pytest + pytest-asyncio (>= 0.24 recommended)
#   * asyncpg
#   * httpx
#   * a real PostgreSQL test database reachable via TEST_DATABASE_URL
#
# asyncio loop scope is pinned to "session" so that the session-scoped
# asyncpg Pool / Connection fixtures and the tests themselves share ONE
# event loop.  asyncpg objects are loop-bound; mixing loop scopes would
# raise "attached to a different loop" errors.

[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths =
    backend/tests
    tests/integration
